{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h2>My Profile</h2>
    <form method="POST">
        <label>Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ user[1] }}">
        <br>
        <label>Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ user[2] }}">
        <br>

        <button class="btn btn-success">
            Save Changes
        </button>

    </form>
</div>
{% endblock %}
